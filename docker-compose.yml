version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - APP_PORT=8080
      - DATABASE_URI=mongodb://mongodb:27017
      - DATABASE_DATABASE=ktravels_publicsite
      - GRAPHQL_PLAYGROUND_ENABLED=true
      - GRAPHQL_INTROSPECTION_ENABLED=true
      - LOGGER_LEVEL=info
      - LOGGER_FORMAT=console
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=ktravels_publicsite
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping")' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data: